<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍一覧',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/index.css}" />
    <script type="text/javascript" th:src="@{/js/book/index.js}"></script>
</head>


<!--エラーポップアップ-->
<div th:if="${popupMessage}" class="modal-overlay" id="popupModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closePopup()">&times;</span>
        <p th:text="${popupMessage}"></p>
    </div>
</div>


<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍一覧</div>

                <div class="right-btn">
                    <a th:href="@{/book/add}" class="book_add_btn">
                        <img th:src="@{/images/icons/add.png}" alt="アイコン"
                            style="height: 16px; vertical-align: middle; margin-right: 5px;">
                        書籍登録</a>
                </div>




                <div class="book_table_area">
                    <table class="book_table">
                        <thead>
                            <tr>
                                <th>書籍名</th>
                                <th>ISBN</th>
                            </tr>
                        </thead>
                        <tbody>
                            <td>
                                <tr th:each="book : ${bookMstList}">
                                    <td>
                                        <!--削除ボタン-->
                                        <a href="#" class="book_delete_btn" th:data-id="${book.id}">
                                            <img th:src="@{/images/icons/trash.png}" alt="ゴミ箱アイコン"
                                                style="height: 16px; vertical-align: middle; margin-right: 5px;" />
                                        </a>
                                        <!--編集ボタン-->
                                        <a th:href="@{/book/edit(id=${book.id})}" class="book_edit_btn">
                                            <img th:src="@{/images/icons/edit.png}" alt="アイコン"
                                                style="height: 16px; vertical-align: middle; margin-right: 5px;">
                                        </a>

                                        <span th:text="${book.title}">タイトル</span>
                                    </td>
                                    <td th:text="${book.isbn}">ISBN</td>
                                </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>

<!-- 削除確認モーダル -->
<div id="deleteConfirmModal" class="modal-overlay2" style="display: none;">
    <div class="modal-content2">
        <p>本当に削除しますか？</p>
        <button id="confirmDeleteBtn">YES</button>
        <span class="modal-close2" onclick="closePopup2()">&times;</span>
        <button onclick="closeModal()">NO</button>
    </div>
</div>
