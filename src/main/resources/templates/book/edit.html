<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍編集',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/edit.css}" />
    <script type="text/javascript" th:src="@{/js/book/edit.js}"></script>
</head>


<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍編集</div>
                <div class="page_contents">
                    <div class="back_and_notice">
                        <p class="required_notice">*は必須です</p>
                        <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                    </div>
                    <form id="book_edit_form" th:object="${bookMstDto}" th:action="@{/book/edit}" method="post">
    
                        <!-- ID（非表示） 書籍を編集する画面で、編集する本のIDを隠しておいて、そのIDをサーバーに送る-->
                        <input type="hidden" th:field="*{id}" />
                    
                        <!-- 書籍名 -->
                        <div class="form-item">
                            <label for="title">書籍名<span style="color:red;">*</span></label>
                            <input type="text" id="title" name="title" th:field="*{title}" />
                            <div class="error_msg" th:if="${titleErrors}">
                                <div th:each="error : ${titleErrors}">
                                    <span th:text="${error}"></span><br/>
                                </div>
                            </div>
                        </div>
                    
                        <!-- ISBN -->
                        <div class="form-item">
                            <label for="isbn">ISBN<span style="color:red;">*</span></label>
                            <input type="text" id="isbn" name="isbn" th:field="*{isbn}" />
                            <div class="error_msg" th:if="${isbnErrors}">
                                <div th:each="error : ${isbnErrors}">
                                    <span th:text="${error}"></span><br/>
                                </div>
                            </div>
                        </div>

                        <div th:if="${errorMessage}" class="error_msg">
                            <p th:text="${errorMessage}"></p>
                        </div>
                    
                        <!-- 保存ボタン -->
                        <div class="center-btn">
                            <button type="submit" class="submit_btn">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
</html>
